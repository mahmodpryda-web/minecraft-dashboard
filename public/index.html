<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم تراخيص البلجن - Mahmoud Plugin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a1a2e; color: #fff; }
        .card { background-color: #16213e; border: 1px solid #0f3460; border-radius: 12px; }
        .table { color: #fff; vertical-align: middle; }
        .table th { background-color: #0f3460; color: #e94560; }
        .btn-custom { background-color: #e94560; color: white; }
        .btn-custom:hover { background-color: #ff2e63; color: white; }
        .badge-active { background-color: #28a745; }
        .badge-off { background-color: #dc3545; }
        .badge-expired { background-color: #ffc107; color: #000; }
    </style>
</head>
<body class="p-4">

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fa-solid fa-cube text-danger me-2"></i> لوحة تحكم التراخيص (Mahmoud Plugin)</h2>
        <button class="btn btn-custom" data-bs-toggle="modal" data-bs-target="#addModal">
            <i class="fa-solid fa-plus me-1"></i> إضافة مشترك جديد
        </button>
    </div>

    <div class="card p-3 shadow-lg">
        <div class="table-responsive">
            <table class="table table-dark table-hover">
                <thead>
                    <tr>
                        <th>المشترك (الاسم)</th>
                        <th>مفتاح التفعيل (License Key)</th>
                        <th>تاريخ الانتهاء</th>
                        <th>الحالة الحالية</th>
                        <th>التحكم السريع</th>
                    </tr>
                </thead>
                <tbody id="licenseTable">
                    <tr><td colspan="5" class="text-center">جاري التحميل...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal Add/Edit -->
<div class="modal fade text-dark" id="addModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">إضافة / تعديل مشترك</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="addForm">
            <div class="mb-3">
                <label class="form-label">اسم المشترك / السيرفر</label>
                <input type="text" id="ownerName" class="form-control" placeholder="مثال: سيرفر أحمد" required>
            </div>
            <div class="mb-3">
                <label class="form-label">مفتاح التفعيل (كود التفعيل)</label>
                <input type="text" id="licenseKey" class="form-control" placeholder="مثال: AHMED-VIP-2026" required>
            </div>
            <div class="mb-3">
                <label class="form-label">تاريخ نهاية الاشتراك</label>
                <input type="date" id="expireDate" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">الحالة</label>
                <select id="statusSelect" class="form-select">
                    <option value="active">مفعل (Active)</option>
                    <option value="off">معطل (Off)</option>
                </select>
            </div>
            <button type="submit" class="btn btn-custom w-100">حفظ المشترك</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    async function loadLicenses() {
        const res = await fetch('/api/licenses');
        const data = await res.json();
        const tbody = document.getElementById('licenseTable');
        tbody.innerHTML = '';

        if (Object.keys(data).length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="text-center">لا يوجد مشتركون حالياً</td></tr>';
            return;
        }

        for (const [key, item] of Object.entries(data)) {
            let statusBadge = '<span class="badge badge-active">مفعل</span>';
            if (item.status === 'off') statusBadge = '<span class="badge badge-off">معطل</span>';
            if (item.status === 'expired') statusBadge = '<span class="badge badge-expired">منتهي</span>';

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${item.owner_name}</strong></td>
                <td><code>${key}</code></td>
                <td>${item.expires}</td>
                <td>${statusBadge}</td>
                <td>
                    <button class="btn btn-sm ${item.status === 'active' ? 'btn-danger' : 'btn-success'} me-1"
                            onclick="toggleStatus('${key}', '${item.owner_name}', '${item.expires}', '${item.status}')">
                        ${item.status === 'active' ? 'إيقاف' : 'تفعيل'}
                    </button>
                    <button class="btn btn-sm btn-outline-light" onclick="deleteLicense('${key}')">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </td>
            `;
            tbody.appendChild(tr);
        }
    }

    async function toggleStatus(key, name, expires, currentStatus) {
        const newStatus = currentStatus === 'active' ? 'off' : 'active';
        await fetch('/api/licenses', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ key, owner_name: name, expires, status: newStatus })
        });
        loadLicenses();
    }

    async function deleteLicense(key) {
        if (confirm('هل أنت تأكد من حذف هذا المشترك؟')) {
            await fetch(`/api/licenses/${key}`, { method: 'DELETE' });
            loadLicenses();
        }
    }

    document.getElementById('addForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const key = document.getElementById('licenseKey').value;
        const owner_name = document.getElementById('ownerName').value;
        const expires = document.getElementById('expireDate').value;
        const status = document.getElementById('statusSelect').value;

        await fetch('/api/licenses', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ key, owner_name, expires, status })
        });

        bootstrap.Modal.getInstance(document.getElementById('addModal')).hide();
        document.getElementById('addForm').reset();
        loadLicenses();
    });

    // Set default date to +1 month
    const nextMonth = new Date();
    nextMonth.setMonth(nextMonth.getMonth() + 1);
    document.getElementById('expireDate').value = nextMonth.toISOString().split('T')[0];

    loadLicenses();
</script>
</body>
</html>
